name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release artifacts
        run: npm run release -- --skip-vsix-install

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          awk -v version="$version" '
            $0 ~ "^## v" version "([[:space:]]|$)" { found=1 }
            found && /^## / && $0 !~ "^## v" version "([[:space:]]|$)" { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            printf 'TSIfDef %s\n' "$version" > "$notes_file"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            target="$(git rev-list -n 1 "$tag")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to $target"
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "TSIfDef ${{ steps.release.outputs.version }}"
            git push origin "$tag"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists"
            exit 1
          fi

          gh release create "$tag" \
            release/*.tgz \
            release/*.vsix \
            release/manifest.json \
            --verify-tag \
            --title "TSIfDef ${{ steps.release.outputs.version }}" \
            --notes-file "${{ steps.release.outputs.notes_file }}"
