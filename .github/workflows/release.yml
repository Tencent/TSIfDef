name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release artifacts
        run: npm run release -- --skip-vsix-install

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          extract_notes() {
            local changelog="$1"
            awk -v heading="## v${version} " '
              index($0, heading) == 1 { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog"
          }

          english_notes="$(extract_notes CHANGELOG.md)"
          chinese_notes="$(extract_notes CHANGELOG.zh-CN.md)"

          if [[ -z "$english_notes" || -z "$chinese_notes" ]]; then
            echo "::error::Both English and Chinese changelog entries are required for $tag"
            exit 1
          fi

          {
            echo "## English"
            echo
            echo "$english_notes"
            echo
            echo "## 简体中文"
            echo
            echo "$chinese_notes"
          } > "$notes_file"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Increment the package version before publishing again."
            exit 1
          fi

          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            target="$(git rev-list -n 1 "$tag")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to $target. Increment the package version."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "TSIfDef ${{ steps.release.outputs.version }}"
            git push origin "$tag"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          gh release create "$tag" \
            release/*.tgz \
            release/*.vsix \
            release/manifest.json \
            --verify-tag \
            --title "TSIfDef ${{ steps.release.outputs.version }}" \
            --notes-file "${{ steps.release.outputs.notes_file }}"
