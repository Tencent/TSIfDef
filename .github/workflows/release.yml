name: Release

on:
  workflow_dispatch:
    inputs:
      npm:
        description: Publish to npm
        type: boolean
        default: true
      vscode_marketplace:
        description: Publish to the VS Code Marketplace
        type: boolean
        default: true

permissions:
  contents: write
  # npm trusted publishing authenticates the workflow itself over OIDC, so no
  # long-lived npm token is stored anywhere.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # The `secrets` context is not available in a step-level `if`, so the
    # Marketplace token is lifted into `env` here. That is what lets the channel
    # skip itself when no token is configured: the VSIX is attached to the
    # GitHub release either way and can be uploaded by hand. npm needs no entry:
    # it authenticates over OIDC instead of a stored token.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1. Node 22 still bundles npm 10,
          # so the major version here is load-bearing, not incidental.
          node-version: 24
          cache: npm
          # Point npm at the public registry explicitly. A developer machine may
          # default to an internal mirror, and publishing there instead of to
          # npmjs.com would be silent.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release artifacts
        run: npm run release -- --skip-vsix-install

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes_file="$RUNNER_TEMP/release-notes.md"

          extract_notes() {
            local changelog="$1"
            awk -v heading="## v${version} " '
              index($0, heading) == 1 { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog"
          }

          english_notes="$(extract_notes CHANGELOG.md)"
          chinese_notes="$(extract_notes CHANGELOG.zh-CN.md)"

          if [[ -z "$english_notes" || -z "$chinese_notes" ]]; then
            echo "::error::Both English and Chinese changelog entries are required for $tag"
            exit 1
          fi

          {
            echo "## English"
            echo
            echo "$english_notes"
            echo
            echo "## 简体中文"
            echo
            echo "$chinese_notes"
          } > "$notes_file"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          # A tag that already points somewhere else means this version was built
          # from different code, which is the case immutability has to reject.
          # A tag on this very commit is just a re-run, so let it through: the
          # publish steps below each skip a channel that already has this version.
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            target="$(git rev-list -n 1 "$tag")"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag already points to $target. Increment the package version."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "TSIfDef ${{ steps.release.outputs.version }}"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          gh release create "$tag" \
            release/*.tgz \
            release/*.vsix \
            release/manifest.json \
            --verify-tag \
            --title "TSIfDef ${{ steps.release.outputs.version }}" \
            --notes-file "${{ steps.release.outputs.notes_file }}"

      # Each registry below is published independently and skips itself when that
      # channel already carries this version. Marketplace access can land later
      # than npm access, so re-running this workflow has to finish the remaining
      # channel without forcing a version bump.

      - name: Publish to npm
        if: ${{ inputs.npm }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          name="$(node -p "require('./package.json').name")"

          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping."
            exit 0
          fi

          # No token: the `id-token: write` permission above lets npm verify over
          # OIDC that this build really came from this repository and workflow.
          npm publish "release/${name}-${version}.tgz" --access public

      - name: Publish to VS Code Marketplace
        if: ${{ inputs.vscode_marketplace && env.VSCE_PAT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          name="$(node -p "require('./package.json').name")"

          # `--skip-duplicate` makes a re-run that already published this version
          # a no-op, so a later channel can be finished without a version bump.
          npx vsce publish --packagePath "release/${name}-${version}.vsix" --skip-duplicate
