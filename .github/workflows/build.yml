name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: tsifdef-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
